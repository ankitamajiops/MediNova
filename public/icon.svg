<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="medinovaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- App Rounded Base -->
  <rect width="512" height="512" rx="115" fill="url(#medinovaGrad)" />
  
  <!-- Subtle Glass Inner Border -->
  <rect x="12" y="12" width="488" height="488" rx="103" stroke="#ffffff" stroke-opacity="0.25" stroke-width="6" fill="none" />

  <!-- Outer Ring Shield -->
  <circle cx="256" cy="256" r="150" stroke="#ffffff" stroke-width="18" stroke-opacity="0.9" fill="none" filter="url(#glow)" />

  <!-- Pulse Waveform in Center -->
  <path d="M 120 256 L 195 256 L 225 185 L 265 330 L 295 220 L 325 256 L 392 256" 
        stroke="#ffffff" 
        stroke-width="22" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)" />

  <!-- Medical Cross Accent Pin at Top -->
  <circle cx="256" cy="145" r="18" fill="#ffffff" filter="url(#glow)" />
</svg>
